<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HT Logística | Sistema Productivo</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script async defer src="https://maps.googleapis.com/maps/api/js?callback=initGoogleMap"></script>
</head>
<body class="dark-theme">
    <div class="app-container">
        <!-- Sidebar / Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <div class="logo-box">HT</div>
                    <span>DISTRIBUIDORA</span>
                </div>
            </div>
            
            <nav class="sidebar-nav" id="nav-tabs">
                <!-- Tabs will be generated here -->
            </nav>

            <div class="sidebar-footer">
                <div class="user-profile">
                    <div class="avatar">MA</div>
                    <div class="user-info">
                        <span class="name">Marco Antonio</span>
                        <span class="role">Chief Dispatcher</span>
                    </div>
                </div>
                <div class="sync-meta" id="sync-timestamp">Sincronizando...</div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <div class="header-left">
                    <h1 id="page-title">Resumen Operativo</h1>
                    <p class="timestamp" id="current-time">Cargando fecha...</p>
                </div>
                <div class="header-actions" id="header-actions">
                    <!-- Dynamic actions per tab -->
                </div>
            </header>

            <div id="tab-content" class="tab-container">
                <!-- Content injected via JS -->
            </div>
        </main>
    </div>

    <!-- Notification Container -->
    <div id="toast-container" class="toast-container"></div>

    <script src="app.js"></script>
</body>
</html>
