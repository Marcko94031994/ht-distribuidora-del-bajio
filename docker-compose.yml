version: '3.8'

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: htlogistics_api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=192.168.1.16;Database=HTLogisticsProd;User Id=sa;Password=SqlServer@2026;TrustServerCertificate=True;MultipleActiveResultSets=true
    ports:
      - "5200:5200"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: htlogistics_frontend
    ports:
      - "3001:80"
    depends_on:
      - api

