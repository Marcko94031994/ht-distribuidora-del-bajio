server {
    listen 80;
    listen [::]:80;
    server_name ht.ggman.uk localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Anti-cache for HTML and root so updates take effect immediately
    location ~* (index\.html|sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Clear-Site-Data '"cache"' always;
        expires -1;
    }

    # Hashed JS and CSS assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Reverse proxy API requests to backend
    location /api/ {
        proxy_pass http://api:5200/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ht.ggman.uk localhost;

    ssl_certificate /etc/letsencrypt/live/ht.ggman.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ht.ggman.uk/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
