services:
  backend:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: ht-backend-prod
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=157.230.95.39;Port=3306;Database=htlogistics_prod;User=ht_user;Password=HtProdPassword2026!Secure;
    ports:
      - "5200:5200"
    volumes:
      - ht-data:/app/Data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`ht.ggman.uk`) && PathPrefix(`/api`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=myresolver"
      - "traefik.http.services.backend.loadbalancer.server.port=5200"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ht-frontend-prod
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`ht.ggman.uk`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=myresolver"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

volumes:
  ht-data:
